name: Playwright Cucumber Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Cucumber smoke tests
        env:
          BASE_URL: https://playwright.dev
        run: node ./node_modules/@cucumber/cucumber/bin/cucumber-js features/playwrightTests.feature --require-module ts-node/register --require 'features/**/*.ts' --tags @Smoke --exit

      - name: Upload cucumber report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: cucumber-report.html
          retention-days: 30
